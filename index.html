    <script>
      // Suppress Vite client WebSocket HMR disconnection notices in sandbox preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('WebSocket closed without opened')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased font-sans selection:bg-emerald-900 selection:text-white">

  </body>
